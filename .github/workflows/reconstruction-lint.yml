name: Reconstruction source lint

on:
  push:
  pull_request:

jobs:
  source_lint:
    name: Reconstruction source lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: pnpm/action-setup@v4
      with:
        version: '10.25.0'
    - name: Install pinned lint dependencies
      run: pnpm install --frozen-lockfile
    - name: Test structural rules and reporting policy
      run: |
        pnpm run test:lint
        pnpm run test:lint:integration
    # Outstanding review debt deliberately fails this workflow. Keeping it
    # separate lets decomp.dev ingest the successful build workflow's report
    # without weakening or hiding the reconstruction-debt check.
    - name: Scan all reconstructed source and headers
      run: pnpm run lint:decomp --format github --limit 50
    - name: Upload reconstruction lint findings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: reconstruction_source_lint
        path: build/fakematch_lint.json
        if-no-files-found: error
