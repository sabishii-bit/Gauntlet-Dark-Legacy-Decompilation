name: Build

on:
  push:
  pull_request:

jobs:
  compiler_payload:
    name: Build reviewed compiler payload
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Install pinned payload toolchain family
      run: |
        sudo apt-get update
        sudo apt-get install --yes clang-18 lld-18 llvm-18 nasm
    - name: Build and authenticate open payload
      run: sh tools/gdl/mwcc_p6/build_payload.sh
    - name: Upload authenticated payload
      uses: actions/upload-artifact@v4
      with:
        name: gdl_mwcc_p6_payload
        path: tools/gdl/mwcc_p6/build/payload.bin
        if-no-files-found: error

  source_lint:
    name: Reconstruction source lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: pnpm/action-setup@v4
      with:
        version: '10.25.0'
    - name: Install pinned lint dependencies
      run: pnpm install --frozen-lockfile
    - name: Test structural rules and reporting policy
      run: |
        pnpm run test:lint
        pnpm run test:lint:integration
    # Outstanding review debt deliberately fails this job. Keep this distinct
    # from the DOL build: do not weaken matching guards to make lint green.
    - name: Scan all reconstructed source and headers
      run: pnpm run lint:decomp --format github --limit 50
    - name: Upload reconstruction lint findings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: reconstruction_source_lint
        path: build/fakematch_lint.json
        if-no-files-found: error

  build:
    name: Build GUNE5D
    needs: compiler_payload
    # This is a *private* build container from gdl-build repository.
    # Contains MWCC compilers and original game files.
    container: ghcr.io/${{ github.repository_owner }}/gdl-build:main

    runs-on: ubuntu-latest

    steps:
    # Checkout the repository
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    # Set Git config
    - name: Git config
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    # Normalize file mod times
    - name: Restore timestamps
      run: |
        uv run https://raw.githubusercontent.com/MestreLion/git-tools/refs/tags/v2022.12/git-restore-mtime \
            --merge --commit-time

    # Copy tools and original files from container to workspace
    - name: Prepare build environment
      run: |
        cp -r /tools/mwcc_compiler tools/
        cp -r /orig/GUNE5D orig/

    - name: Download authenticated compiler payload
      uses: actions/download-artifact@v4
      with:
        name: gdl_mwcc_p6_payload
        path: tools/gdl/mwcc_p6/build

    # The container's ninja-compatible builder lacks `-t deps`, which the
    # provenance audit requires. Use pinned Ninja for builds and diagnostics.
    - name: Install diagnostic-capable Ninja
      run: |
        uv tool install ninja==1.13.0
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    # Cache build artifacts
    # (v2: cache key bumped after retiring the container's wine-wrapped dtk 1.8.0,
    # which wrote stale split state into cached build dirs)
    - name: Cache build
      uses: actions/cache@v4
      with:
        path: |
          build
        key: ${{ runner.os }}-gune5d-v2-${{ github.sha }}
        restore-keys: ${{ runner.os }}-gune5d-v2-

    # The normal compiler archive does not redistribute the reviewed local
    # derivatives. Derive both from authenticated bases and the open payload.
    - name: Install authenticated compiler profiles
      run: |
        if [ -f build/compilers/GC/1.2.5/mwcceppc.exe ] && \
           [ -f build/compilers/GC/1.2.5n/mwcceppc.exe ]; then
          python tools/gdl/mwcc_p6/setup_compilers.py build/compilers \
            --payload tools/gdl/mwcc_p6/build/payload.bin
        else
          python tools/download_tool.py compilers build/compilers \
            --tag 20251118 \
            --gdl-special-compilers \
            --gdl-special-payload tools/gdl/mwcc_p6/build/payload.bin
        fi

    # Configure the project. decomp-toolkit (dtk) is downloaded automatically
    # as a native Linux binary at the version pinned in configure.py (dtk_tag).
    # The explicit profile makes CI/reporting compile gamemain.c with 1.2.5s
    # and registry.c with 1.2.5sn instead of measuring their fallback state.
    - name: Configure
      run: |
        ninja --version
        ninja -t list
        python configure.py -v GUNE5D --experimental-p6-compiler

    # Build the project using ninja
    - name: Build
      env:
        HOME: /tmp
        WINEPREFIX: /tmp/.wine
      run: ninja

    # Verify SHA1 hash matches
    - name: Verify build
      run: |
        echo "Verifying build against expected SHA1..."
        sha1sum -c config/GUNE5D/build.sha1
        if [ $? -eq 0 ]; then
          echo "✅ Build matches! SHA1 hash verified."
        else
          echo "❌ Build does not match expected SHA1!"
          exit 1
        fi

    # The host-native source_lint job owns the ast-grep and lint-integration
    # suites. Keep the private compiler container focused on Python analysis;
    # pnpm's action-provided executable is not visible inside this container.
    - name: Analysis tool tests
      env:
        HOME: /tmp
        WINEPREFIX: /tmp/.wine
      run: |
        # objneutral's live freshness tests use a source-built NonMatching TU.
        # The default DOL links its extracted fallback, so a restored cache can
        # contain a stale source object that the normal build never refreshes.
        ninja build/GUNE5D/src/game/enemy/critter.o
        python -m unittest discover tools/gdl/tests -b

    - name: Reconstruction diagnostics
      env:
        WINEPREFIX: /tmp/.wine
      run: python tools/gdl/reconstruction_preflight.py --smoke-tools

    # Upload build artifacts
    - name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: GUNE5D_build
        path: |
          build/GUNE5D/main.dol
          build/GUNE5D/main.elf

    # Upload the progress report. decomp.dev ingests this artifact to serve
    # the progress badges/graphic in the README (once the repo is registered
    # at https://decomp.dev). The artifact name must end in `_report`.
    - name: Upload progress report
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: GUNE5D_report
        path: build/GUNE5D/report.json

    # Upload build report (if it exists)
    - name: Upload build report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build_report
        path: |
          build/GUNE5D/config.json
          objdiff.json
