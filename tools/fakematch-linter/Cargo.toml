[package]
name = "fakematch-lint"
version = "0.1.1"
edition = "2024"
description = "Review-only C/C++ reconstruction-debt (fakematch) linter for decompilation projects"
license = "MIT"
default-run = "fakematch-lint"

[lib]
name = "fakematch_lint"
path = "src/lib.rs"

[[bin]]
name = "fakematch-lint"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
notify = "8"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
toml = "0.9"
tree-sitter = "0.27"
tree-sitter-cpp = "0.23"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
